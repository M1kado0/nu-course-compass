[project]
name = "nu-course-compass"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "M1kado0", email = "sagataldiyar@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "google-auth-oauthlib>=1.4.1",
    "langchain>=1.4.2",
    "langchain-anthropic>=1.7.4",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.5",
    "langchain-openai>=1.6.6",
    "langgraph>=1.2.12",
    "openpyxl>=3.1.5",
    "pillow>=12.3.0",
    "pymupdf>=1.28.2",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.3",
    "torch>=2.14.0",
    "truststore>=0.10.4",
    "unstructured[pdf]>=0.27.8",
    "xlrd>=2.0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
nu-course-compass = "nu_course_compass:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"
